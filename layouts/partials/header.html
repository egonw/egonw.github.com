<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="{{ "/" | relURL }}" typeof="foaf:Person" about="{{ site.Params.foafURI }}"><span property="foaf:givenname">{{ site.Params.givenName }}</span> <span property="foaf:family_name">{{ site.Params.familyName }}</span></a>
    <nav aria-label="Main">
      <ul>
        {{- $page := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent .Menu . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
