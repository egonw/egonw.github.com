{{- with site.Data.slides }}
<div class="slider">
  {{- range $i, $s := . }}
  {{- $img := $s.image }}
  {{- if not (hasPrefix $img "http") }}{{ $img = $img | relURL }}{{ end }}
  <div class="slide{{ if eq $i 0 }} active{{ end }}" style="background-image: linear-gradient(transparent, rgba(0,0,0,0.35), rgba(0,0,0,0.75)), url('{{ $img }}')">
    <div>
      <h4>{{ $s.title }}</h4>
      <a href="{{ $s.url }}">{{ $s.url }}</a>
    </div>
  </div>
  {{- end }}
  <button type="button" class="slide-prev" aria-label="Previous slide">&lsaquo;</button>
  <ul class="slider-dots">
    {{- range $i, $s := . }}
    <li><button type="button" class="dot{{ if eq $i 0 }} active-dot{{ end }}" aria-label="Slide {{ add $i 1 }}"></button></li>
    {{- end }}
  </ul>
  <button type="button" class="slide-next" aria-label="Next slide">&rsaquo;</button>
</div>
{{- end }}
